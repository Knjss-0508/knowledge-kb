name: knowledge-kb-confidence-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: confidence-test-postgres
    environment:
      POSTGRES_USER: confidence_test
      POSTGRES_PASSWORD: confidence_test_only
      POSTGRES_DB: confidence_test
    volumes:
      - confidence_test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confidence_test -d confidence_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: confidence-test-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: knowledge-kb-migrate:latest
    container_name: confidence-test-migrate
    command: ["python", "-m", "app.scripts.initialize_database"]
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: confidence_test
      POSTGRES_PASSWORD: confidence_test_only
      POSTGRES_DB: confidence_test
      DB_CONNECT_RETRIES: "30"
      DB_CONNECT_RETRY_SECONDS: "2"
      DB_CONNECT_TIMEOUT_SECONDS: "10"
      EMBEDDING_DIMENSIONS: "1024"
      ALLOW_INSECURE_DEFAULT_ADMIN: "true"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: knowledge-kb-backend:latest
    container_name: confidence-test-backend
    ports:
      - "127.0.0.1:18010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: confidence_test
      POSTGRES_PASSWORD: confidence_test_only
      POSTGRES_DB: confidence_test
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_BASE_URL: http://host.docker.internal:8080/v1
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      EMBEDDING_API_KEY: ""
      EMBEDDING_DIMENSIONS: "1024"
      MEDIA_STORAGE_BACKEND: local
      UPLOAD_DIR: /app/uploads
      BACKGROUND_WORKERS_ENABLED: "false"
      DEEPSEEK_BASE_URL: ""
      DEEPSEEK_API_KEY: ""
      GROUP_LLM_BASE_URL: ""
      GROUP_LLM_API_KEY: ""
    volumes:
      - confidence_test_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  confidence_test_pg_data:
  confidence_test_uploads:
