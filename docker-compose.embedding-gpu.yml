services:
  backend:
    depends_on:
      embedding-qwen:
        condition: service_healthy

  embedding-qwen:
    # The default works with older CUDA drivers. Override TEI_GPU_IMAGE with
    # 120-1.9.1 on CUDA 12.9/Blackwell servers after preflight validation.
    image: ${TEI_GPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.3}
    container_name: kb-embedding-qwen
    restart: unless-stopped
    gpus: all
    environment:
      # Docker Desktop on WSL injects the Windows NVIDIA driver at this path.
      # Set TEI_GPU_LD_PRELOAD empty on hosts where the preload is unnecessary.
      LD_PRELOAD: ${TEI_GPU_LD_PRELOAD:-/usr/lib/x86_64-linux-gnu/libcuda.so.1}
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --auto-truncate
    expose:
      - "80"
    # Answer Hub 直接跑在 Windows 宿主上（E:\answer-hub-runtime\venv），
    # 不在 Docker 网络内，因此需要把嵌入端口发布到宿主回环地址才能访问。
    # 仅绑定 127.0.0.1，不对局域网或公网暴露；容器内服务仍走 expose 的 80。
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - embedding_model_cache:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

volumes:
  embedding_model_cache:
