# Include this file inside the trusted HTTPS server block for
# zsk2.powerzhuan.cn. It exposes only the two plugin integration endpoints;
# the knowledge management UI and all upstream ingestion APIs remain private
# to the existing project entry points.

location = /api/v1/integration/standard-search {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors off;
}

location = /api/v1/integration/retrieval-events:batch {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors off;
}
