# Include this file inside the project HTTP(S) server block for
# knowledgekb.powerzhuan.cn. It exposes only the two plugin integration endpoints and
# task-scoped GPU runner calls. Other ingestion or embedding administration
# APIs remain protected by their existing authentication and routing boundary.

location = /api/v1/integration/standard-search {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors off;
}

location = /api/v1/integration/retrieval-events:batch {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors off;
}

# A copied task URL is only a path prefix. The local runner appends exactly one
# of these POST actions. Each request still requires the task-specific token;
# no global Runner token or knowledge-management endpoint is exposed here.
location ~ ^/api/v1/embedding-model/runner/tasks/etj-[A-Za-z0-9._-]+/(probe|claim|heartbeat|progress|complete|fail)$ {
    limit_except POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors off;
}
